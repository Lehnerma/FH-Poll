<app-topbar title="Admin">
  <button type="button" class="btn btn--secondary" (click)="logout()">Abmelden</button>
</app-topbar>

<main class="page">
  <h1 class="page__title">Dashboard</h1>

  <div class="page__grid">
    <!-- Umfragen-Verwaltung folgt später -->
    <div class="tile" aria-disabled="true">
      <span class="tile__kicker">Route A</span>
      <span class="tile__title">Umfragen</span>
      <span class="tile__meta">Kommt bald</span>
    </div>

    <a class="tile" routerLink="/admin/praxis">
      <span class="tile__kicker">Route B</span>
      <span class="tile__title">Praxis</span>
      <span class="tile__meta">Boxen ansehen und bearbeiten</span>
    </a>
  </div>
</main>
