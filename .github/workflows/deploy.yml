name: Deploy (SSH)

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read

# Nie zwei Deploys gleichzeitig.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Upload per SSH (rsync)
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      # Zielordner auf dem Server (Repository-Variable, absolut oder relativ zum Home, mit Schrägstrich am Ende).
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - name: Zielpfad prüfen
        run: |
          if [ -z "$DEPLOY_PATH" ] || [ "$DEPLOY_PATH" = "/" ]; then
            echo "::error::Repository-Variable DEPLOY_PATH fehlt oder ist unsicher ('$DEPLOY_PATH')."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

      - name: SSH vorbereiten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload per rsync
        run: |
          rsync --archive --compress --delete --itemize-changes \
            -e "ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes" \
            dist/poll/browser/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}"
