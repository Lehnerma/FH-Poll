name: Deploy (SSH)

# Deployt nach jedem Merge auf main, aber nur wenn "Quality Checks" für genau diesen Commit grün waren.
# Manuell startbar über "Run workflow" (Actions-Tab).
on:
  workflow_run:
    workflows: ['Quality Checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Upload per SSH (rsync)
    # Nur bei erfolgreichen Checks eines Pushs auf main (nicht bei Pull-Request-Läufen) oder manuell.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      # Zielordner auf dem Server (Repository-Variable, absolut oder relativ zum Home, mit Schrägstrich am Ende).
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - name: Zielpfad prüfen
        run: |
          if [ -z "$DEPLOY_PATH" ] || [ "$DEPLOY_PATH" = "/" ]; then
            echo "::error::Repository-Variable DEPLOY_PATH fehlt oder ist unsicher ('$DEPLOY_PATH')."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # Genau der Commit, den die Checks geprüft haben (bei manuellem Start: der gewählte Branch).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

      - name: SSH vorbereiten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload per rsync
        run: |
          rsync --archive --compress --delete --itemize-changes --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes" \
            dist/poll/browser/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}"
